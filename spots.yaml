# Config for gooddays. No locations or settings are hard-coded in the code.

settings:
  # NWS requires a descriptive User-Agent with contact info. Don't commit your
  # email: set GOODDAYS_NWS_USER_AGENT in your shell instead, e.g.
  #   export GOODDAYS_NWS_USER_AGENT="gooddays (you@example.com)"
  # (A nws_user_agent value here is used only if the env var is unset.)
  # IANA timezone passed to Open-Meteo; hourly/daily times are local to it.
  timezone: America/New_York

spots:
  - id: bristol-mountain     # unique, stable slug; used in logs and data/raw paths
    name: Bristol Mountain
    lat: 42.745
    lon: -77.404
    activities: [skiing]    # any of: hiking, biking, skiing

  - id: gore-mountain
    name: Gore Mountain
    lat: 43.6825
    lon: -73.9917
    activities: [skiing]

  - id: whiteface-mountain
    name: Whiteface Mountain
    lat: 44.365865
    lon: -73.903139
    activities: [skiing]

  - id: stowe-mountain
    name: Stowe Mountain
    lat: 44.5006
    lon: -72.7183
    activities: [skiing]
