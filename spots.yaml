# Config for gooddays. No locations or settings are hard-coded in the code.

settings:
  # NWS requires a descriptive User-Agent with contact info. Don't commit your
  # email: set GOODDAYS_NWS_USER_AGENT in your shell instead, e.g.
  #   export GOODDAYS_NWS_USER_AGENT="gooddays (you@example.com)"
  # (A nws_user_agent value here is used only if the env var is unset.)
  # IANA timezone passed to Open-Meteo; hourly/daily times are local to it.
  timezone: America/New_York

# Limits for scoring each day (score_conditions). Hourly checks run over daylight
# hours; a day passes when at least min_run_hours consecutive hours pass them all.
# Downhill skiing also requires snow (see below); cross-country does not need fresh snow.
thresholds:
  hiking:
    min_temperature_f: 45                    # an hour passes at or above this
    max_precipitation_probability_pct: 30    # at or below this
    max_precipitation_in: 0.1                # per hour, at or below this
    min_run_hours: 4
  downhill_skiing:
    max_temperature_f: 32                    # an hour passes below this
    max_wind_mph: 10                         # below this
    # Snow is required: overnight snowfall above min_snowfall_in, OR snow on the
    # ground above min_snow_depth_in.
    min_snowfall_in: 0
    min_snow_depth_in: 0                     # placeholder: tune for your mountains
    min_run_hours: 4
  cross_country_skiing:
    min_snow_depth_in: 5                     # an hour passes at or above this depth
    min_temperature_f: 10                    # at or above this, and ...
    max_temperature_f: 32                    # ... below this (min must be below max)
    max_wind_mph: 10                         # below this
    max_precipitation_probability_pct: 30    # at or below this
    max_rain_in: 0                           # liquid rain per hour; 0 means any rain fails
    min_run_hours: 4

spots:
