[project]
name = "gooddays"
version = "0.1.0"
description = "Is it a good day? Checks weather for favorite outdoor spots."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.4.0,<3",
    "boto3>=1.43.126,<2",
    "httpx",
    "pyyaml",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gooddays"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long lines in tests are mostly parameter tables and sample YAML.
"tests/*" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

# boto3 and botocore ship no type information; we use one call (SNS publish).
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
